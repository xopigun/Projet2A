# Configuration OpenOCD pour la Blue Pill (STM32F103C8), via un ST-Link V2.
#
# Le ST-Link ne relie que SWDIO, SWCLK et GND : la carte est alimentee par son
# propre USB, qui fournit aussi le 5 V du transceiver.
#
# Certains clones portent un CKS32F103 dont l'identifiant SWD differe de celui
# de ST ; OpenOCD refuse alors la connexion. Ne pas modifier ce fichier a
# l'aveugle : voir docs/bringup.md, section N4, pour le diagnostic.
source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f1x.cfg]
reset_config none
