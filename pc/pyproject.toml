[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canbench"
version = "0.1.0"
description = "Outils PC du banc de test CAN du groupe 69 (G69-BANC-001)"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Samuel GOMRI" },
    { name = "Dylan KIATI" },
    { name = "Hugo MATHOUX" },
]
dependencies = [
    "python-can>=4.3",
    "cantools>=39",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# Interfaces materielles : installees a la demande.
# gs_usb est le firmware candleLight du CANable 2.0 ; slcan n'a besoin que de pyserial.
gs-usb = ["gs-usb>=0.3", "pyusb>=1.2"]
slcan = ["pyserial>=3.5"]

[project.scripts]
canbench = "canbench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["canbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fichier genere : sa mise en forme est celle du generateur, pas celle de ruff.
"canbench/icd_gen.py" = ["E501", "E741"]
